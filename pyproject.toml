[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "utility-belt"
dynamic = ["version"]
description = "Canivete suíço pessoal de terminal para Windows e Linux"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Thiago Andrade" }
]
dependencies = [
    "typer>=0.12.0",
    "platformdirs>=4.0.0",
    "tomli-w>=1.0.0",
    "questionary>=2.0.0",
    "requests>=2.32.0",
    "watchdog==6.0.0",
    "pyperclip==1.11.0",
]

[project.scripts]
belt = "utility_belt.cli:main"
utility-belt = "utility_belt.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.6,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/utility_belt"]

[tool.hatch.version]
path = "src/utility_belt/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
