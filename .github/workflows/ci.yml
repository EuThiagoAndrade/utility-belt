name: CI

on:
  pull_request:
  workflow_call:
    inputs:
      revision:
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install uv==0.12.13
      - run: uv run --group dev python scripts/validate_governance.py
      - run: uv run --group dev ruff check
      - run: uv run --group dev pytest
      - run: git diff --check
      - run: uv build
